# Boot:  docker compose up --build -d --wait api worker
# Test:  docker compose --profile test run --rm --build tests
# Nothing here needs a secret:
# Postgres uses trust auth and is reachable only on the private compose network.
name: tenant-control-plane

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: control_plane
      POSTGRES_HOST_AUTH_METHOD: trust # local dev only, port not published
    volumes:
      - pgdata:/var/lib/postgresql/data # tenants survive restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane -d control_plane"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    # Kafka-API compatible broker, single binary, no ZooKeeper.
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_PORT:-19092}
    ports:
      # Host access for Kafka tools; override with KAFKA_PORT=29092
      - "${KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 60

  # One-shot: declare topics explicitly instead of relying on auto-create.
  topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in tenant.tasks tenant.task-updates tenant.task-updates.dlq; do
          rpk topic create "$$t" --partitions 3 --replicas 1 -X brokers=redpanda:9092 \
            || rpk topic describe "$$t" -X brokers=redpanda:9092 >/dev/null
        done
        echo "topics ready"

  api:
    build: { context: ., target: runtime }
    environment: &cp-env
      CP_DATABASE_URL: postgresql://control_plane@postgres:5432/control_plane
      CP_KAFKA_BOOTSTRAP: redpanda:9092
      CP_LOG_LEVEL: INFO
    ports:
      - "${API_PORT:-8000}:8000" # override with API_PORT=8080
    depends_on:
      postgres: { condition: service_healthy }
      topics: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    build: { context: ., target: runtime }
    command: ["worker-sim"]
    environment:
      WORKER_KAFKA_BOOTSTRAP: redpanda:9092
      # Override at restart time, e.g.
      #   WORKER_FAIL_RATE=1 docker compose up -d --force-recreate --no-deps worker
      WORKER_FAIL_RATE: ${WORKER_FAIL_RATE:-0}
      WORKER_MIN_DELAY_MS: ${WORKER_MIN_DELAY_MS:-500}
      WORKER_MAX_DELAY_MS: ${WORKER_MAX_DELAY_MS:-2000}
      WORKER_DUPLICATE_RATE: ${WORKER_DUPLICATE_RATE:-0}
      WORKER_REORDER_RATE: ${WORKER_REORDER_RATE:-0}
    depends_on:
      topics: { condition: service_completed_successfully }
    restart: unless-stopped

  # Test runner: lint + format check + type check + security scan + full pytest suite.
  tests:
    profiles: ["test"]
    build: { context: ., target: dev }
    environment:
      <<: *cp-env
      CP_TEST_DATABASE_URL: postgresql://control_plane@postgres:5432/control_plane_test
      E2E_API_URL: http://api:8000
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }
      worker: { condition: service_started }

volumes:
  pgdata:
